name: Deploy Yii2 to Docker Swarm

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_IMAGE: your-dockerhub-username/yii2-app
  DOCKER_TAG: latest
  SWARM_SERVICE_NAME: yii2_web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: docker/Dockerfile
        push: true
        tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Install SSH key
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy to Docker Swarm
      run: |
        ssh -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "docker service update \
            --image ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} \
            ${{ env.SWARM_SERVICE_NAME }}"
        
        # Health check
        ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "curl -sSf http://localhost:8000 > /dev/null || exit 1"

    - name: Verify deployment
      run: |
        echo "Deployment successful!"
        echo "Access your app at: http://${{ secrets.EC2_HOST }}"